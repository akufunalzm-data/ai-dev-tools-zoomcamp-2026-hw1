<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Shared Household Chores</title>
</head>
<body>
    <main>
        <h1>Household members</h1>
        <p><a href="{% url 'active_chore_list' %}">View active chores</a></p>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.name.errors }}
            <label for="{{ form.name.id_for_label }}">Name</label>
            {{ form.name }}
            <button type="submit">Add member</button>
        </form>

        <ul>
            {% for member in members %}
                <li>{{ member.name }}</li>
            {% empty %}
                <li>No household members yet.</li>
            {% endfor %}
        </ul>

        <p><a href="{% url 'chore_create' %}">Add a chore</a></p>
    </main>
</body>
</html>
