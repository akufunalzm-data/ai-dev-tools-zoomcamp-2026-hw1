<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add chore</title>
</head>
<body>
    <main>
        <h1>Add chore</h1>
        <p><a href="{% url 'active_chore_list' %}">View active chores</a></p>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                {{ field.errors }}
                <p>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </p>
            {% endfor %}
            <button type="submit">Add chore</button>
        </form>
    </main>
</body>
</html>
